<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Messages & Orders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="web.css">
    <style>
        /* Admin page wrapper override */
        body.admin-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: none;
            background-attachment: unset;
        }
    </style>
</head>
<body class="admin-page">
    <!-- Login Form -->
    <div class="login-container" id="loginContainer">
        <h1>🔐 Admin Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter admin password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
    </div>

    <!-- Dashboard -->
    <div class="dashboard-container" id="dashboardContainer">
        <div class="dashboard-header">
            <h1>📊 Admin Dashboard</h1>
            <div>
                <button class="refresh-btn" onclick="loadAllData()">🔄 Refresh</button>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="dashboard-content">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('messages')">📧 Messages <span id="msg-count">(0)</span></button>
                <button class="tab-btn" onclick="switchTab('orders')">🛒 Orders <span id="order-count">(0)</span></button>
            </div>

            <!-- Messages Tab -->
            <div class="tab-content show" id="messagesTab">
                <div id="messagesList"></div>
            </div>

            <!-- Orders Tab -->
            <div class="tab-content" id="ordersTab">
                <div id="ordersList"></div>
            </div>
        </div>
    </div>

    <script src="web.js"></script>
</body>
</html>
