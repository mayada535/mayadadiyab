<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mayada Diyab - IT Student, Web Developer, and AI Enthusiast. Explore my portfolio and get in touch.">
    <title>Mayada Diyab - Personal Website</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Lato:wght@400;700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="web.css">
</head>
<body>

<nav id="navbar">
    <div class="nav-container">
        <div class="logo">Mayada Diyab</div>
        <div class="nav-links">
            <a href="#home" class="nav-link active" data-en="Home" data-ar="الرئيسية">Home</a>
            <a href="#about" class="nav-link" data-en="About" data-ar="من أنا">About</a>
            <a href="#portfolio" class="nav-link" data-en="Portfolio" data-ar="المشاريع">Portfolio</a>
            <a href="#contact" class="nav-link" data-en="Contact" data-ar="التواصل">Contact</a>
        </div>
        <button id="lang-switch" data-lang="en">العربية</button>
    </div>
</nav>

<main>

<section id="home" class="section">
    <div class="container">
        <h1 data-en="Hi, I'm Mayada Diyab" data-ar="مرحبًا! أنا ميادة دياب">Hi, I'm Mayada Diyab</h1>
        <h2 data-en="IT Student | Aspiring Web Developer | AI Enthusiast"
            data-ar="طالبة تقنية المعلومات | مطورة ويب طموحة | مهتمة بالذكاء الاصطناعي"></h2>
        <p data-en="Welcome to my personal website!"
           data-ar="مرحبًا بك في موقعي الشخصي!"></p>
        <a href="#about" class="cta-btn" data-en="Learn More" data-ar="اعرف المزيد">Learn More</a>
    </div>
</section>

<section id="about" class="section">
    <div class="container">
        <h2 data-en="About Me" data-ar="من أنا">About Me</h2>
        <p data-en="Hello! I'm Mayada, a fourth-year IT student..."
           data-ar="مرحبًا! أنا ميادة، طالبة في السنة الرابعة..."></p>
    </div>
</section>

<section id="portfolio" class="section">
    <div class="container">
        <h2 data-en="My Projects" data-ar="مشاريعي">My Projects</h2>
        <div class="portfolio-grid">
            <div class="project-card">
                <h3>Kazooha AI</h3>
                <p>AI project in progress</p>
            </div>
        </div>
    </div>
</section>

<section id="contact" class="section">
    <div class="container">
        <h2 data-en="Get In Touch" data-ar="تواصل معي">Get In Touch</h2>

        <form id="contact-form">
            <input type="text" id="name" placeholder="Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <textarea id="message" placeholder="Message" required></textarea>
            <button type="submit">Send</button>
        </form>
    </div>
</section>

</main>

<footer>
    <p>© 2025 Mayada Diyab</p>
</footer>

<!-- JS منفصل تمامًا -->
<script type="module" src="web.js"></script>

</body>
</html>
